# Dependabot keeps the pinned base image and CI actions up to date.
# The upstream UNOMP git clone is pinned by commit SHA in the Dockerfile
# and is intentionally NOT tracked here — bump it deliberately.

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
